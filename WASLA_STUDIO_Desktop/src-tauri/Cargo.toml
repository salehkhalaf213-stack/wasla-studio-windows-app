[package]
name = "wasla-studio"
version = "1.1.5-test.1"
description = "QENTRIVO Cloud Workspace"
authors = ["QENTRIVO"]
edition = "2021"

[lib]
name = "wasla_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
updater = ["dep:tauri-plugin-updater"]
portable = []

[build-dependencies]
tauri-build = { version = "2.0.0" }

[dependencies]
tauri = { version = "2.0.0" }
tauri-plugin-updater = { version = "=2.0.0", optional = true }
serde_json = "1.0"
