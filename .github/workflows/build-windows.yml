name: Build QENTRIVO for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/wasla-web-v6
      - test/windows-isolated-supabase
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  build-isolated-test-windows:
    if: github.ref == 'refs/heads/test/windows-isolated-supabase'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: WASLA_STUDIO_Desktop
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WASLA_STUDIO_Desktop/package.json
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify isolated test desktop
        run: npm run build
      - name: Build isolated test executable (no updater, no installer)
        run: npm run tauri -- build --no-bundle
      - name: Package isolated test ZIP
        shell: pwsh
        run: |
          $appExe = "src-tauri/target/release/wasla-studio.exe"
          if (-not (Test-Path $appExe)) { throw "Test executable missing: $appExe" }
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $dir = "QENTRIVO-TEST-$version"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item $appExe "$dir/QENTRIVO-TEST.exe"
          @"
          QENTRIVO ISOLATED TEST BUILD
          Connected only to the separate Supabase test project.
          This build does not include automatic updater or installer.
          Do not use production accounts or production data here.
          "@ | Set-Content "$dir/README.txt" -Encoding utf8
          $zip = "$dir-Portable.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip -CompressionLevel Optimal
          if ((Get-Item $zip).Length -lt 100000) { throw "Test ZIP unexpectedly small." }
          Write-Host "Created $zip"
      - name: Upload isolated test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: QENTRIVO-ISOLATED-TEST-WINDOWS
          path: WASLA_STUDIO_Desktop/QENTRIVO-TEST-*-Portable.zip
          if-no-files-found: error

  build-windows:
    if: github.ref == 'refs/heads/feature/wasla-web-v6' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    defaults:
      run:
        working-directory: WASLA_STUDIO_Desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WASLA_STUDIO_Desktop/package.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify desktop HTML and inline JavaScript
        run: npm run build

      - name: Build signed Windows installer
        run: npm run tauri -- build --bundles nsis --features updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Prepare public installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated." }
          Copy-Item $installer.FullName "QENTRIVO-Windows-Setup.exe"

      - name: Build portable executable without installer updater
        run: npm run tauri -- build --no-bundle --features portable
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols

      - name: Package portable ZIP and update manifest
        shell: pwsh
        run: |
          $appExe = "src-tauri/target/release/wasla-studio.exe"
          if (-not (Test-Path $appExe)) { throw "Portable executable was not generated: $appExe" }
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $portableDir = "QENTRIVO-$version-Portable"
          if (Test-Path $portableDir) { Remove-Item $portableDir -Recurse -Force }
          New-Item -ItemType Directory -Path $portableDir | Out-Null
          Copy-Item $appExe "$portableDir/QENTRIVO.exe"
          Copy-Item "scripts/portable-updater.ps1" "$portableDir/QENTRIVO-Portable-Updater.ps1"
          @"
          QENTRIVO Windows Portable

          Run QENTRIVO.exe to start the application.
          The application checks for portable updates in the background.
          Updates are downloaded and verified before replacing the application executable.
          A backup of the previous executable is kept in this folder after a successful update.
          Microsoft Edge WebView2 Runtime is required on Windows.
          This portable package does not uninstall or overwrite an installed version.
          Your application data and cloud records are not included in this ZIP.
          "@ | Set-Content "$portableDir/README.txt" -Encoding utf8

          $portableZip = "QENTRIVO-$version-Portable.zip"
          if (Test-Path $portableZip) { Remove-Item $portableZip -Force }
          Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -CompressionLevel Optimal
          if (-not (Test-Path $portableZip) -or (Get-Item $portableZip).Length -lt 100000) {
            throw "Portable ZIP is missing or unexpectedly small."
          }

          $stablePortableZip = "QENTRIVO-Portable.zip"
          Copy-Item $portableZip $stablePortableZip -Force
          $portableHash = (Get-FileHash -Path $stablePortableZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $portableManifest = [ordered]@{
            version = $version
            notes = "QENTRIVO Windows Portable automatic update"
            url = "https://github.com/salehkhalaf213-stack/wasla-studio-windows-app/releases/download/preview-latest/QENTRIVO-Portable.zip"
            sha256 = $portableHash
          }
          $portableManifest | ConvertTo-Json -Depth 5 | Set-Content "portable-latest.json" -Encoding utf8

          Write-Host "Portable version: $version"
          Write-Host "Portable ZIP size: $((Get-Item $portableZip).Length) bytes"
          Write-Host "Portable ZIP SHA-256: $portableHash"

      - name: Create Tauri updater manifest
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated." }
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath)) { throw "Tauri updater signature is missing: $signaturePath" }
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $signature = (Get-Content $signaturePath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) { throw "Tauri updater signature is empty." }
          $downloadUrl = "https://github.com/salehkhalaf213-stack/wasla-studio-windows-app/releases/download/preview-latest/$($installer.Name)"
          $manifest = [ordered]@{
            version = $version
            notes = "QENTRIVO Windows automatic update"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $downloadUrl
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content "latest.json" -Encoding utf8

      - name: Upload installer, portable ZIP and updater files
        uses: actions/upload-artifact@v4
        with:
          name: QENTRIVO-Windows-Installer
          path: |
            WASLA_STUDIO_Desktop/src-tauri/target/release/bundle/nsis/*.exe
            WASLA_STUDIO_Desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            WASLA_STUDIO_Desktop/QENTRIVO-Windows-Setup.exe
            WASLA_STUDIO_Desktop/QENTRIVO-*-Portable.zip
            WASLA_STUDIO_Desktop/QENTRIVO-Portable.zip
            WASLA_STUDIO_Desktop/latest.json
            WASLA_STUDIO_Desktop/portable-latest.json
          if-no-files-found: error

      - name: Publish Windows preview
        if: github.ref == 'refs/heads/feature/wasla-web-v6'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          name: QENTRIVO Windows Preview #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            WASLA_STUDIO_Desktop/QENTRIVO-Windows-Setup.exe
            WASLA_STUDIO_Desktop/QENTRIVO-*-Portable.zip

      - name: Publish automatic updater feeds
        if: github.ref == 'refs/heads/feature/wasla-web-v6'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-latest
          name: QENTRIVO Windows Automatic Updates (Preview)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            WASLA_STUDIO_Desktop/src-tauri/target/release/bundle/nsis/*.exe
            WASLA_STUDIO_Desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            WASLA_STUDIO_Desktop/latest.json
            WASLA_STUDIO_Desktop/QENTRIVO-Portable.zip
            WASLA_STUDIO_Desktop/portable-latest.json

      - name: Publish public Windows download
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QENTRIVO Windows ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            WASLA_STUDIO_Desktop/QENTRIVO-Windows-Setup.exe
            WASLA_STUDIO_Desktop/QENTRIVO-*-Portable.zip
            WASLA_STUDIO_Desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
